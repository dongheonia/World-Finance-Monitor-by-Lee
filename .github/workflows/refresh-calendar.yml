name: Refresh financial calendar

# Runs itself every day (00:00 UTC) with no developer step — see
# scripts/refresh-calendar.mjs for exactly what it fetches and why (schedule-only:
# new rate-decision dates for US/EU/Japan/China, nothing else). workflow_dispatch is
# there purely so this can be re-run by hand from the Actions tab to check it's still
# working, without needing to wait for the next run.
on:
  schedule:
    # Daily rather than monthly (2026-10-10, explicit request: shortest cadence that can
    # be automated) — the script only ever adds new entries, so a run with nothing new
    # is a no-op with no commit.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run calendar refresh
        run: node scripts/refresh-calendar.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet -- js/data/calendar-config.js; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/calendar-config.js
          SUBJECT="Auto-refresh financial calendar schedule dates"
          BODY="Adds newly-published rate-decision dates (US/EU/Japan/China) found by scripts/refresh-calendar.mjs -- schedule only, no values or times. See that script for sources and what is not covered."
          git commit -m "$SUBJECT" -m "$BODY"
          git push
